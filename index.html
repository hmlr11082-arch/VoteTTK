    <script>
      // Suppress Vite HMR WebSocket connection warnings in Cloud Run preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
            String(event.reason?.message).includes('WebSocket') ||
            String(event.reason).includes('failed to connect to websocket'))
        ) {
          event.preventDefault();
        }
      });

      // Filter out non-fatal internal Firestore BloomFilter re-query fallback warnings
      const origConsoleWarn = console.warn;
      console.warn = function (...args) {
        if (
          args[0] &&
          (String(args[0]).includes('BloomFilter') ||
            String(args[0]).includes('bloom filter') ||
            (args[1] && String(args[1]).includes('BloomFilter')))
        ) {
          return;
        }
        origConsoleWarn.apply(console, args);
      };
    </script>
  </head>
